AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Arells alien-generate worker — long Grok jobs off Amplify SSR

Parameters:
  S3BucketName:
    Type: String
  GrokApiKey:
    Type: String
    NoEcho: true

Resources:
  AlienGenerateWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: arells-alien-generate-worker
      PackageType: Image
      Timeout: 900
      MemorySize: 3008
      Architectures:
        - x86_64
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          GROK_API_KEY: !Ref GrokApiKey
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !Sub 'arn:aws:s3:::${S3BucketName}'
                - !Sub 'arn:aws:s3:::${S3BucketName}/*'
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../..
      DockerTag: alien-generate-worker

Outputs:
  WorkerFunctionName:
    Value: !Ref AlienGenerateWorker
  WorkerFunctionArn:
    Value: !GetAtt AlienGenerateWorker.Arn
